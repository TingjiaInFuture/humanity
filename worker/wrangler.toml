name = "humanity-charter-api"
main = "src/index.js"
compatibility_date = "2026-08-14"

# Secrets are set with `wrangler secret put`, not here:
#   GITHUB_TOKEN      – fine-grained PAT (Discussions/Issues/Contents/Pull requests write)
#   IP_HASH_SALT      – random value for hashed-IP rate limiting
#   TURNSTILE_SECRET  – optional today, recommended before public launch: when set,
#                       every anonymous write must pass Turnstile siteverify

[vars]
GITHUB_OWNER = "TingjiaInFuture"
GITHUB_REPO = "humanity"
GITHUB_BASE_BRANCH = "main"
DISCUSSION_CATEGORY = "Ideas"
ALLOWED_ORIGIN = "https://tingjiainfuture.github.io"
CHARTER_ZH_PATH = "docs/CHARTER.zh-CN.txt"
CHARTER_EN_PATH = "docs/CHARTER.en.txt"
RATE_LIMIT_WINDOW_SECONDS = "3600"
RATE_LIMIT_MAX = "6"

[[d1_databases]]
binding = "DB"
database_name = "humanity-charter"
database_id = "aef259e6-56d1-4234-a920-eed35e938902"
migrations_dir = "migrations"
